receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  hostmetrics:
    collection_interval: ${env:HOSTMETRICS_INTERVAL:-60s}
    root_path: /hostfs
    scrapers:
      cpu: {}
      disk: {}
      load: {}
      filesystem: {}
      memory: {}
      network: {}
      paging: {}
      process:
        mute_process_name_error: true
        mute_process_exe_error: true
        mute_process_io_error: true
        mute_process_user_error: true
      processes: {}

  docker_stats:
    endpoint: unix:///var/run/docker.sock
    api_version: ${env:DOCKER_STATS_API_VERSION:-1.44}
    collection_interval: ${env:DOCKER_STATS_INTERVAL:-10s}
    timeout: 20s
    # Promote Docker/Coolify labels to metric attributes so SigNoz can group by
    # stable app identity instead of Coolify's token-suffixed container.name.
    # Keys = Docker label names; values = attribute names in SigNoz.
    # Verify labels on a host with:
    #   docker inspect <container> --format '{{json .Config.Labels}}'
    container_labels_to_metric_labels:
      com.docker.compose.project: docker.compose.project
      com.docker.compose.service: docker.compose.service
      coolify.name: coolify.name
      coolify.serviceName: coolify.serviceName
      coolify.projectName: coolify.projectName
      coolify.applicationName: coolify.applicationName
      coolify.resourceName: coolify.resourceName
    excluded_images:
      - signoz-collection-agent
      - /otel\/opentelemetry-collector.*/
      - /.*pause.*/

  filelog:
    include: [/var/lib/docker/containers/*/*-json.log]
    start_at: ${env:FILELOG_START_AT:-end}
    include_file_name: false
    include_file_path: true
    operators:
      - id: container-parser
        type: container
        format: docker
        add_metadata_from_filepath: false

processors:
  batch:
    send_batch_size: 1000
    timeout: 10s

  resourcedetection:
    detectors: [env, system, docker]
    timeout: 2s
    system:
      hostname_sources: [os]

  memory_limiter:
    check_interval: 5s
    limit_mib: ${env:MEMORY_LIMITER_LIMIT_MIB:-4000}
    spike_limit_mib: ${env:MEMORY_LIMITER_SPIKE_MIB:-800}

exporters:
  # OTLP/HTTP exporter. Required when sending through Cloudflare (HTTPS on 443).
  # SIGNOZ_OTLP_ENDPOINT must be a full URL, e.g. https://otel.roborew.xyz
  # (the collector appends /v1/traces, /v1/metrics, /v1/logs). TLS comes from the
  # https:// scheme, so no insecure flag is needed for the Cloudflare path.
  otlphttp:
    endpoint: ${env:SIGNOZ_OTLP_ENDPOINT}
    headers:
      signoz-ingestion-key: ${env:SIGNOZ_INGESTION_KEY:-}

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  pprof:
    endpoint: 0.0.0.0:1777
  zpages:
    endpoint: 0.0.0.0:55679

service:
  extensions: [health_check, pprof, zpages]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, batch]
      exporters: [otlphttp]
    metrics:
      receivers: [otlp, hostmetrics, docker_stats]
      processors: [memory_limiter, resourcedetection, batch]
      exporters: [otlphttp]
    logs:
      receivers: [otlp, filelog]
      processors: [memory_limiter, resourcedetection, batch]
      exporters: [otlphttp]
