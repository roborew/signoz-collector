# Coolify deployment: OpenTelemetry Collector for Docker host monitoring.
# Deploy one instance per Docker host. Sends telemetry to SigNoz via OTLP/HTTP
# (HTTPS on 443 through Cloudflare). App secrets + tuning live in Infisical;
# Coolify only needs INFISICAL_* bootstrap (+ per-host DEPLOYMENT_ENVIRONMENT).
# Build pack: Docker Compose (uses this file by default). config.yaml is baked
# into the image via the Dockerfile — do NOT bind-mount it (Coolify remaps
# relative bind mounts to app storage where the file is missing, which fails).
# network_mode: host is required for host metrics, Docker stats/logs, and OTLP listeners.
# App containers on the same host must NOT use localhost or Coolify service DNS —
# they send OTLP to http://host.docker.internal:4318 with
# extra_hosts: ["host.docker.internal:host-gateway"]. Full env contract: see README.md.
# NOTE: Do not use YAML anchors (&/ *) — Coolify's compose preprocessor fails with
# "no service selected" on cold deploys (https://github.com/coollabsio/coolify/issues/2705).

services:
  signoz-collection-agent:
    build:
      context: .
      args:
        OTEL_COLLECTOR_VERSION: ${OTEL_COLLECTOR_VERSION:-0.139.0}
    image: signoz-collection-agent:${OTEL_COLLECTOR_VERSION:-0.139.0}
    container_name: signoz-collection-agent
    restart: unless-stopped
    user: "0:0"
    network_mode: host
    environment:
      # --- Infisical bootstrap only (set these in Coolify) ---
      INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID:-}
      INFISICAL_ENV: ${INFISICAL_ENV:-}
      INFISICAL_API_URL: ${INFISICAL_API_URL:-}
      INFISICAL_CLIENT_ID: ${INFISICAL_CLIENT_ID:-}
      INFISICAL_CLIENT_SECRET: ${INFISICAL_CLIENT_SECRET:-}
      # --- Per-host label (Coolify; differs per Docker host) ---
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=${DEPLOYMENT_ENVIRONMENT:-production}
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /:/hostfs:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:13133"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
